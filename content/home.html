<div class="page-content">
    <form id="note-form" class="note-form">
        <input type="text" id="note-title" placeholder="Заголовок заметки..." required />
        <textarea id="note-text" placeholder="Текст заметки..." rows="3" required></textarea>
        <button type="submit" class="btn-primary">Добавить заметку</button>
    </form>

    <div id="error-message" class="error-msg" style="display: none;"></div>

    <section>
        <h2>Ваши заметки</h2>
        <div id="notes-list" class="notes-list"></div>
    </section>
</div>
