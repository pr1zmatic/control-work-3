<!DOCTYPE html>
<html lang="ru">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки PWA</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#1e1e1e">
    <meta name="mobile-web-app-capable" content="yes">
    </head>
<body>

    <div class="app-container">
        <header class="header">
        <h1>📚 Заметки</h1>
        <div class="header-right">
            <span id="status-badge" class="badge online">Онлайн</span>
            <button id="install-btn" class="btn-install" style="display: none;">Установить</button>
        </div>
        </header>

        <nav class="nav-tabs">
        <button id="home-btn" class="tab-btn active">Главная</button>
        <button id="about-btn" class="tab-btn">О приложении</button>
        </nav>

        <!-- Сюда динамически подгружается контент (App Shell) -->
        <main id="app-content"></main>
    </div>

    <script src="app.js"></script>
    </body>
</html>
